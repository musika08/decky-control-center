<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --w: 1280px; --h: 1060px; }
  html, body { margin: 0; background: transparent; }
  body { width: var(--w); height: var(--h); font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; }
  .card {
    position: relative; width: var(--w); height: var(--h); border-radius: 28px; overflow: hidden; box-sizing: border-box;
    padding: 46px 64px 0;
    background:
      radial-gradient(760px 420px at 100% 0%, rgba(59, 130, 246, 0.22), transparent 62%),
      radial-gradient(760px 460px at 0% 100%, rgba(37, 99, 235, 0.24), transparent 62%),
      linear-gradient(150deg, #070b14 0%, #0b1324 55%, #0d1a33 100%);
    box-shadow: inset 0 0 0 1px rgba(147, 197, 253, 0.14);
  }
  .head { font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 34px; font-weight: 650;
    letter-spacing: -0.02em; color: #fff; margin: 0 0 6px; }
  .sub { font-size: 18px; color: #93a8c4; margin: 0 0 34px; }
  /* sized so the whole 496x969 capture fits (870 px tall): the Wi-Fi network row and the battery switch stay in view */
  .cols { display: grid; grid-template-columns: 445px 445px; gap: 96px; justify-content: center; }
  .label { font-size: 13px; letter-spacing: 0.26em; text-transform: uppercase; color: #93c5fd; font-weight: 600;
    margin: 0 0 14px 4px; }
  .frame {
    border-radius: 18px 18px 0 0; overflow: hidden; height: 870px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(147, 197, 253, 0.22);
    -webkit-mask-image: linear-gradient(180deg, #000 93%, transparent 100%);
  }
  .shot { position: relative; }
  .shot img { display: block; width: 100%; }
  /* Covers private names (Wi-Fi network, Bluetooth devices). Positions are in % of the 496x969 capture.
     The source captures are also pixelated there, so the names are not in the repository either. */
  .hide {
    position: absolute; border-radius: 8px;
    background: rgba(40, 46, 58, 0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
</style>
</head>
<body>
<div class="card">
  <div class="head">Right in Steam's Quick Access menu</div>
  <div class="sub">Real captures from a ROG Xbox Ally X running Decky Loader for Windows. Network and device names blurred.</div>
  <div class="cols">
    <div><div class="label">Screen, sound and Wi-Fi</div><div class="frame"><div class="shot">
      <img src="panel-top.png" alt="">
      <div class="hide" style="left:17.3%; top:78.3%; width:28.6%; height:4.1%"></div>
    </div></div></div>
    <div><div class="label">Bluetooth devices and battery</div><div class="frame"><div class="shot">
      <img src="panel-bottom.png" alt="">
      <div class="hide" style="left:17.3%; top:7.4%; width:28.6%; height:1.7%; border-radius: 0 0 6px 6px"></div>
      <div class="hide" style="left:24.6%; top:31.2%; width:17.0%; height:6.4%"></div>
      <div class="hide" style="left:24.6%; top:42.9%; width:25.8%; height:6.4%"></div>
    </div></div></div>
  </div>
</div>
</body>
</html>
