<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --w: 1280px; --h: 400px; }
  html, body { margin: 0; background: transparent; }
  body { width: var(--w); height: var(--h); font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; }
  .card {
    position: relative; width: var(--w); height: var(--h); border-radius: 28px; overflow: hidden;
    background:
      radial-gradient(900px 420px at 88% -10%, rgba(59, 130, 246, 0.34), transparent 60%),
      radial-gradient(700px 380px at 72% 120%, rgba(37, 99, 235, 0.30), transparent 62%),
      radial-gradient(520px 300px at 8% 110%, rgba(96, 165, 250, 0.14), transparent 65%),
      linear-gradient(135deg, #070b14 0%, #0b1324 45%, #0d1a33 100%);
    box-shadow: inset 0 0 0 1px rgba(147, 197, 253, 0.14);
  }
  /* fine grid that fades out to the right */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(147, 197, 253, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(147, 197, 253, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(0,0,0,0.15) 60%, transparent);
  }
  .mark { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); }
  .content { position: absolute; left: 84px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow {
    font-size: 15px; letter-spacing: 0.32em; text-transform: uppercase; color: #93c5fd; font-weight: 600;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0; font-size: 100px; line-height: 1; font-weight: 650; letter-spacing: -0.035em;
    background: linear-gradient(180deg, #ffffff 0%, #dbeafe 70%, #9dbcf0 100%);
    -webkit-background-clip: text; color: transparent;
  }
  .tag { margin-top: 18px; font-size: 25px; color: #b6c6dc; font-weight: 400; letter-spacing: -0.005em; }
  .chips { margin-top: 30px; display: flex; gap: 10px; }
  .chip {
    font-size: 14.5px; font-weight: 600; color: #d6e6fb; padding: 8px 14px; border-radius: 999px;
    background: rgba(147, 197, 253, 0.08); box-shadow: inset 0 0 0 1px rgba(147, 197, 253, 0.20);
  }
  .chip b { color: #93c5fd; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <!-- the mark: three sliders on a rounded tile, the panel's own icon idea -->
  <svg class="mark" width="300" height="300" viewBox="0 0 300 300" fill="none">
    <defs>
      <radialGradient id="glow" cx="0.42" cy="0.38" r="0.75">
        <stop offset="0" stop-color="#dbeafe" stop-opacity="0.55"/>
        <stop offset="0.4" stop-color="#3b82f6" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#bfdbfe" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#2563eb" stop-opacity="0.35"/>
      </linearGradient>
      <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#60a5fa"/>
        <stop offset="1" stop-color="#bfdbfe"/>
      </linearGradient>
    </defs>
    <rect x="12" y="12" width="276" height="276" rx="70" stroke="url(#edge)" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="40" y="40" width="220" height="220" rx="54" stroke="url(#edge)" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="40" y="40" width="220" height="220" rx="54" fill="url(#glow)"/>
    <g stroke-linecap="round">
      <path d="M86 108 H214" stroke="#bfdbfe" stroke-opacity="0.22" stroke-width="8"/>
      <path d="M86 108 H180" stroke="url(#fill)" stroke-width="8"/>
      <path d="M86 150 H214" stroke="#bfdbfe" stroke-opacity="0.22" stroke-width="8"/>
      <path d="M86 150 H124" stroke="url(#fill)" stroke-width="8"/>
      <path d="M86 192 H214" stroke="#bfdbfe" stroke-opacity="0.22" stroke-width="8"/>
      <path d="M86 192 H158" stroke="url(#fill)" stroke-width="8"/>
    </g>
    <circle cx="180" cy="108" r="13" fill="#f0f7ff"/>
    <circle cx="124" cy="150" r="13" fill="#f0f7ff"/>
    <circle cx="158" cy="192" r="13" fill="#f0f7ff"/>
  </svg>
  <div class="content">
    <div class="eyebrow">Decky Loader for Windows</div>
    <h1>Control Center</h1>
    <div class="tag">Windows quick settings in Steam's Quick Access menu</div>
    <div class="chips">
      <div class="chip"><b>Brightness</b> &amp; volume</div>
      <div class="chip">Wi-Fi &amp; Bluetooth pairing</div>
      <div class="chip">Battery charge limit</div>
    </div>
  </div>
</div>
</body>
</html>
